server:
  port: 8080

spring:
  application:
    name: workflow-engine

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:flowlab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_UNTIL_1_9=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# FlowLab Engine Configuration
flowlab:
  lease:
    duration-seconds: 30
  recovery:
    enabled: true
    interval-ms: 3000
    stuck-timeout-seconds: 30
  outbox:
    enabled: true
    interval-ms: 1000
    batch-size: 50
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

logging:
  level:
    com.flowlab: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
